<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <script>
      (function () {
        var r = document.documentElement;
        var ua = navigator.userAgent || '';
        var isIos =
          /iPhone|iPad|iPod/i.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) ||
          r.dataset.forceIos === 'true' ||
          r.dataset.forceDocScroll === 'true';
        r.classList.toggle('is-ios-device', isIos);
        if (isIos) {
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i += 1) metas[i].remove();
        }
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DriveLens" />
    <title>DriveLens · Shared Drive Photo Gallery</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2338bdf8'/%3E%3Crect x='5' y='5' width='14' height='14' rx='2' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='9.5' cy='9.5' r='1.5' fill='white'/%3E%3Cpath d='m19 15-3.5-3.5a1.5 1.5 0 0 0-2.1 0L7 18' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/layout.css" />
    <link rel="stylesheet" href="./styles/components.css" />
    <link rel="stylesheet" href="./styles/compare.css" />
  </head>
  <body>
    <div class="app-shell">
      <header id="topHeader" class="top-header"></header>
      <div id="demoBanner" class="demo-banner hidden"></div>
      <div class="workspace">
        <div id="drawerBackdrop" class="drawer-backdrop"></div>
        <aside id="sidebarPanel" class="sidebar"></aside>
        <main class="gallery-stage">
          <div id="gallerySubbar" class="gallery-subbar"></div>
          <div id="galleryScroll" class="gallery-scroll">
            <div id="batchBar" class="batch-bar hidden"></div>
            <div id="galleryGrid"></div>
          </div>
        </main>
        <aside id="inspectorPanel" class="inspector"></aside>
      </div>
      <nav id="mobileNavBar" class="mobile-nav-bar"></nav>
      <div id="iosTopPocketShim" class="ios-pocket-shim ios-pocket-shim-top" aria-hidden="true"></div>
      <div id="iosBottomPocketShim" class="ios-pocket-shim ios-pocket-shim-bottom" aria-hidden="true"></div>
      <div id="lightboxRoot" class="hidden"></div>
      <div id="compareRoot" class="hidden"></div>
      <div id="modalRoot"></div>
      <div id="toastContainer" class="toast-container"></div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
